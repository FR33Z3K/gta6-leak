<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA 6 LEAK - Download</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#06060f;font-family:system-ui,Arial,sans-serif;color:#fff;}
  #msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:10;pointer-events:none;
       text-shadow:0 0 18px #ff00d4,0 0 6px #000;animation:flash .6s infinite alternate;}
  @keyframes flash{from{color:#fff;}to{color:#ffe600;}}
  #msg h1{font-size:clamp(30px,7vw,84px);margin:0;}
  #msg p{font-size:clamp(18px,3.5vw,32px);}
  .p{position:fixed;will-change:transform;user-select:none;pointer-events:none;z-index:5;}
  #close{position:fixed;top:14px;right:14px;z-index:20;background:#fff;color:#111;border:none;border-radius:8px;
          padding:10px 16px;font-size:15px;cursor:pointer;font-weight:700;}
</style>
</head>
<body>
  <button id="close" onclick="document.body.innerHTML='<div id=\'msg\'><h1>pode fechar a aba 👋</h1></div>';">fechar</button>
  <div id="msg">
    <h1>🍆 GTA 6 LEAK 🍆</h1>
    <p>DOWNLOAD 100% REAL... brincadeira, você caiu 😂🍆</p>
  </div>
<script>
  const N = 160;
  const items=[];
  for(let i=0;i<N;i++){
    const el=document.createElement("div");
    el.className="p";
    el.textContent="🍆";
    el.style.fontSize=(34+Math.random()*70)+"px";
    document.body.appendChild(el);
    items.push({el,
      x:Math.random()*innerWidth, y:Math.random()*innerHeight,
      vx:(Math.random()*2-1)*6||3, vy:(Math.random()*2-1)*6||3,
      rot:Math.random()*360, vr:(Math.random()*2-1)*10});
  }
  function tick(){
    const w=innerWidth,h=innerHeight;
    for(const it of items){
      it.x+=it.vx; it.y+=it.vy; it.rot+=it.vr;
      if(it.x<0||it.x>w-40){it.vx*=-1;it.x=Math.max(0,Math.min(w-40,it.x));}
      if(it.y<0||it.y>h-40){it.vy*=-1;it.y=Math.max(0,Math.min(h-40,it.y));}
      it.el.style.transform=`translate(${it.x}px,${it.y}px) rotate(${it.rot}deg)`;
    }
    requestAnimationFrame(tick);
  }
  tick();
</script>
</body>
</html>
